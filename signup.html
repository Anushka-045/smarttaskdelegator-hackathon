<!DOCTYPE html>
<html lang="en">
<head>
  <title>Signup | Smart Task Delegator</title>

  <style>
    :root {
      --bg-main: #f8f9fc;
      --card-bg: #ffffff;
      --neon: #b6ff00;
      --text-dark: #111;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .glass {
      width: 400px;
      padding: 35px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    h2 {
      color: var(--neon);
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      background: var(--neon);
      font-weight: bold;
      cursor: pointer;
    }

    .google-btn {
      background: #fff;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>

<body>

<div class="glass">
  <h2>Smart Task Delegator</h2>

  <button class="google-btn" id="googleLogin">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
    Continue with Google
  </button>

  <input id="username" placeholder="Username">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="phone" placeholder="Phone">
  <input id="skills" placeholder="Skills (comma separated)">

  <button id="submit">Create Account</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgyMmefbJjeMBRK8lZ_MgkfgcsTwo2Q7M",
  authDomain: "loginform-f0336.firebaseapp.com",
  databaseURL: "https://loginform-f0336-default-rtdb.firebaseio.com",
  projectId: "loginform-f0336",
  storageBucket: "loginform-f0336.firebasestorage.app",
  messagingSenderId: "444250525738",
  appId: "1:444250525738:web:04580411603a5c37ef7353"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

document.getElementById("googleLogin").onclick = () => {
  const provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider).then(res => {
    const user = res.user;
    return set(ref(db, "users/" + user.uid), {
      username: user.displayName || "",
      email: user.email,
      phone: "",
      skills: [],
      workload: 0,
      role: "user"
    });
  }).then(() => {
    window.location.href = "index.html";
  });
};

document.getElementById("submit").onclick = () => {
  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const phone = document.getElementById("phone").value;
  const skills = document.getElementById("skills").value
    .split(",")
    .map(s => s.trim().toLowerCase())
    .filter(Boolean);

  createUserWithEmailAndPassword(auth, email, password)
    .then(res => set(ref(db, "users/" + res.user.uid), {
      username,
      email,
      phone,
      skills,
      workload: 0,
      role: "user"
    }))
    .then(() => window.location.href = "index.html");
};
</script>

</body>
</html>
