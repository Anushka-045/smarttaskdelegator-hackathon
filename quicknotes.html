<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Notes Board | Smart Task Delegator</title>
<style>
body { font-family: Arial,sans-serif; background:#e0f7ff; color:#034f84; margin:0; padding:0; }
header { display:flex; justify-content:space-between; align-items:center; background:#7ec8e3; color:white; padding:15px 20px; font-size:24px;}
header a, header button { color:white; text-decoration:none; margin-left:10px; padding:6px 12px; border-radius:6px; border:none; cursor:pointer; background-color:rgba(255,255,255,0.2);}
header a:hover, header button:hover { background-color:rgba(255,255,255,0.4);}
.container { padding:20px; max-width:900px; margin:auto;}
input, textarea, button { padding:10px; margin:5px 0; font-size:16px; width:100%; box-sizing:border-box; border-radius:6px; border:1px solid #ccc;}
button { background-color:#034f84; color:white; border:none; cursor:pointer;}
button:hover { background-color:#022f4b;}
#notesBoard { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;}
.note { background:#fff6b3; padding:15px; border-radius:8px; width:200px; min-height:100px; position:relative; box-shadow:0 3px 6px rgba(0,0,0,0.1);}
.note p { margin:0; word-wrap: break-word;}
.deleteBtn { position:absolute; top:5px; right:8px; background:#ff4b4b; color:white; border:none; border-radius:4px; padding:2px 6px; cursor:pointer;}
</style>
</head>
<body>

<header>
  <div>Smart Task Delegator</div>
  <div>
    <a href="index.html">Home</a>
    <a href="coverpage.html">Logout</a>

  </div>
</header>

<div class="container">
  <h3>Add a Quick Note</h3>
  <textarea id="noteText" placeholder="Write your note here..."></textarea>
  <button id="addNoteBtn">Add Note</button>

  <h3>All Notes</h3>
  <div id="notesBoard"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgyMmefbJjeMBRK8lZ_MgkfgcsTwo2Q7M",
  authDomain: "loginform-f0336.firebaseapp.com",
  projectId: "loginform-f0336",
  storageBucket: "loginform-f0336.appspot.com",
  messagingSenderId: "444250525738",
  appId: "1:444250525738:web:04580411603a5c37ef7353",
  databaseURL: "https://loginform-f0336-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;

const noteText = document.getElementById('noteText');
const addNoteBtn = document.getElementById('addNoteBtn');
const notesBoard = document.getElementById('notesBoard');


onAuthStateChanged(auth, (user) => {
  if(user){
    currentUser = user;
    loadNotes();
  } else {
    currentUser = null;
    notesBoard.innerHTML = '';
    alert("Please log in");
    window.location.href = 'coverpage.html';
  }
});


addNoteBtn.addEventListener('click', () => {
  if(!currentUser) return alert("Please log in to add notes.");
  const text = noteText.value.trim();
  if(!text) return alert("Enter some text!");

  const notesRef = ref(db, `notes/${currentUser.uid}`);
  push(notesRef, {
    text,
    userEmail: currentUser.email,
    timestamp: Date.now()
  });

  noteText.value = '';
});


function loadNotes(){
  const notesRef = ref(db, `notes/${currentUser.uid}`);
  onValue(notesRef, (snapshot) => {
    notesBoard.innerHTML = '';
    snapshot.forEach(noteSnap => {
      const note = noteSnap.val();
      const noteDiv = document.createElement('div');
      noteDiv.className = 'note';
      noteDiv.innerHTML = `<p><strong>${note.userEmail}:</strong> ${note.text}</p>`;

      const delBtn = document.createElement('button');
      delBtn.className = 'deleteBtn';
      delBtn.textContent = 'X';
      delBtn.addEventListener('click', () => {
        remove(ref(db, `notes/${currentUser.uid}/${noteSnap.key}`));
      });
      noteDiv.appendChild(delBtn);

      notesBoard.appendChild(noteDiv);
    });
  });
}
</script>

</body>
</html>
