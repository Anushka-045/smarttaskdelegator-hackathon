<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App | Real-Time</title>

<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Josefin Sans', sans-serif;
  background: linear-gradient(135deg, #dbeafe, #f8fafc);
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: 110px 20px 60px;
}

h1 {
  background: linear-gradient(150deg, #7bd0d6, #6fd1c6, #6ffff3); /* 3 colors: blue → pink → yellow */
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 10px;
  margin-bottom: 30px;
  text-align: center;
  font-weight: 700;
}



.new-todo {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 20px 35px rgba(0,0,0,0.1);
  display: grid;
  grid-template-columns: 1fr 150px 120px 90px;
  gap: 12px;
  margin-bottom: 35px;
}

.new-todo input,
.new-todo select,
.new-todo button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #c7d2fe;
  font-size: 14px;
}

.new-todo input:focus,
.new-todo select:focus {
  outline: none;
  border-color: #006d82;
  box-shadow: 0 0 8px rgba(125, 216, 255, 0.882);
}

.new-todo button {
  background: linear-gradient(90deg, #99c9e0, #5fefff);
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
}

.new-todo button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0, 21, 117, 0.4);
}

.todo-item {
  background: white;
  padding: 16px 18px;
  margin-bottom: 14px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 12px 25px rgba(0,0,0,0.08);
  transition: transform 0.25s, box-shadow 0.25s;
}

.todo-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 35px rgba(0,0,0,0.12);
}

.todo-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.todo-left input {
  width: 18px;
  height: 18px;
  accent-color: #0a92a1;
}

.todo-text {
  font-size: 20px;
  color: #0183d3;
  font-weight: 300;
}

.todo-text.completed {
  text-decoration: line-through;
  color: #3c8975;
}

.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  height: 64px;
  background: linear-gradient(90deg, #c4fcfe, #98d6ff);
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0; 
  z-index: 100;
}


.nav-left {
  font-size: 20px;
  font-weight: 700;
  color: rgb(0, 0, 0);
  letter-spacing: 0.5px;
}
.nav-left .logo {
  width: 40px;  
  height: 40px;
  margin-right: 10px; 
  vertical-align: middle;
}
.nav-right {
  display: flex;
  gap: 22px;
  align-items: center;
  color: rgb(0, 0, 0);
  font-weight: 600;
  
}

.nav-right {
  display: flex;
  gap: 22px;
  align-items: center;
  padding-right: 36px; 
}


.nav-right a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 2px;
  background: white;
  transition: width 0.3s;
}

.nav-right a:hover::after {
  width: 100%;
}

.priority {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
  display: inline-block;
}

.high {
  background: #fee2e2;
  color: #a73c65;
}

.medium {
  background: #fef3c7;
  color: #e58d11;
}

.low {
  background: #dcfce7;
  color: #22e56d;
}

.todo-date {
  font-size: 12px;
  color: #64748b;
}

</style>
</head>

<body>
<div class="navbar">
  <div class="nav-left">
    <img src="logo.png" alt="Logo" class="logo">
    <span>Smart Task Delegator</span>
  </div>
  <div class="nav-right">
    <a href="dashboard.html">Home</a>
    <a href="index.html">Logout</a>
  </div>
</div>


  <div class="container">
    <h1>TODO</h1>

    <form class="new-todo" onsubmit="addItem(event)">
      <input id="todo-input" placeholder="Task name..." />
      <input type="date" id="todo-date" />
      <select id="todo-priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button>Add</button>
    </form>

    <div id="todo-list"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
  import { 
    getDatabase, ref, push, set, onValue, update 
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAgyMmefbJjeMBRK8lZ_MgkfgcsTwo2Q7M",
    authDomain: "loginform-f0336.firebaseapp.com",
    projectId: "loginform-f0336",
    storageBucket: "loginform-f0336.appspot.com",
    messagingSenderId: "444250525738",
    appId: "1:444250525738:web:04580411603a5c37ef7353",
    databaseURL: "https://loginform-f0336-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUserId = null;
  let currentUserName = null;

  onAuthStateChanged(auth, user => {
    if (user) {
      currentUserId = user.uid;
      currentUserName = user.displayName || user.email;
      loadTodos();
    } else {
      alert("Please login first");
    }
  });

  function loadTodos() {
    const tasksRef = ref(db, `todos/${currentUserId}`);
    onValue(tasksRef, snapshot => {
      const list = document.getElementById("todo-list");
      list.innerHTML = "";

      snapshot.forEach(childSnap => {
        const data = childSnap.val();
        const id = childSnap.key;

        const item = document.createElement("div");
        item.className = "todo-item";

        const left = document.createElement("div");
        left.className = "todo-left";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = data.status === "completed";
        checkbox.onchange = () => toggleStatus(id);

        const text = document.createElement("div");
        text.className = "todo-text";
        text.innerText = data.text;
        if (data.status === "completed") text.classList.add("completed");

        left.appendChild(checkbox);
        left.appendChild(text);

        const right = document.createElement("div");
        right.style.textAlign = "right";

        const date = document.createElement("div");
        date.className = "todo-date";
        date.innerText = data.date || "";

        const priority = document.createElement("div");
        priority.className = `priority ${data.priority}`;
        priority.innerText = data.priority.toUpperCase();

        right.appendChild(priority);
        right.appendChild(date);

        item.appendChild(left);
        item.appendChild(right);
        list.appendChild(item);
      });
    });
  }

  window.addItem = function(e) {
    e.preventDefault();

    const text = document.getElementById("todo-input").value.trim();
    const date = document.getElementById("todo-date").value;
    const priority = document.getElementById("todo-priority").value;

    if (!text) return;

    const tasksRef = ref(db, `todos/${currentUserId}`);
    const newTaskRef = push(tasksRef);

    set(newTaskRef, {
      username: currentUserName,
      text,
      date,
      priority,
      status: "active"
    });

    document.getElementById("todo-input").value = "";
    document.getElementById("todo-date").value = "";
  };

  function toggleStatus(id) {
    const taskRef = ref(db, `todos/${currentUserId}/${id}`);
    onValue(taskRef, snapshot => {
      const status = snapshot.val().status === "active" ? "completed" : "active";
      update(taskRef, { status });
    }, { onlyOnce: true });
  }
</script>

</body>
</html>
