<!DOCTYPE html>
<html lang="en">
<head>
<title>Signup | Smart Task Delegator</title>
<style>
:root {
    --bg-main: #f8f9fc;
    --card-bg: #ffffff;
    --neon: #b6ff00;
}
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.glass {
    max-width: 400px;
    width: 100%;
    padding: 40px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    text-align: center;
}
input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid #ddd;
}
button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    font-weight: bold;
    background: var(--neon);
}
.google-btn {
    background: #fff;
    border: 1px solid #ddd;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="glass">

<h2 id="title">Smart Task Delegator</h2>

<div id="normalSignup">
<button class="google-btn" id="googleLogin">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
Continue with Google
</button>

<hr>

<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="skills" placeholder="Skills (comma separated)">
<button id="submit">Create Account</button>
</div>

<div id="googleSignup" style="display:none">
<input id="g-username" placeholder="Username (optional)">
<input id="g-skills" placeholder="Skills (comma separated)">
<input id="g-phone" placeholder="Phone (optional)">
<button id="googleSave">Continue</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgyMmefbJjeMBRK8lZ_MgkfgcsTwo2Q7M",
  authDomain: "loginform-f0336.firebaseapp.com",
  databaseURL: "https://loginform-f0336-default-rtdb.firebaseio.com",
  projectId: "loginform-f0336"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const isGoogle = params.get("google");

if (isGoogle) {
  document.getElementById("normalSignup").style.display = "none";
  document.getElementById("googleSignup").style.display = "block";
  document.getElementById("title").innerText = "Complete Your Profile";
}

document.getElementById("googleLogin")?.addEventListener("click", async () => {
  const provider = new GoogleAuthProvider();
  const result = await signInWithPopup(auth, provider);
  sessionStorage.setItem("googleUser", JSON.stringify({
    uid: result.user.uid,
    name: result.user.displayName,
    email: result.user.email
  }));
  window.location.href = "signup.html?google=1";
});

document.getElementById("googleSave")?.addEventListener("click", async () => {
  const data = JSON.parse(sessionStorage.getItem("googleUser"));
  const skillsInput = document.getElementById("g-skills").value;
  const skills = {};
  skillsInput.split(",").forEach(s => {
    const key = s.trim().toLowerCase();
    if (key) skills[key] = true;
  });

  const phone = document.getElementById("g-phone").value;
  const username = document.getElementById("g-username").value || data.name;

  await set(ref(db, "users/" + data.uid), {
    username,
    email: data.email,
    phone,
    skills,
    workload: 0,
    role: "user"
  });

  sessionStorage.removeItem("googleUser");
  window.location.href = "index.html";
});

document.getElementById("submit")?.addEventListener("click", async () => {
  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const skillsInput = document.getElementById("skills").value;
  const skills = {};
  skillsInput.split(",").forEach(s => {
    const key = s.trim().toLowerCase();
    if (key) skills[key] = true;
  });


  const res = await createUserWithEmailAndPassword(auth, email, password);

  await set(ref(db, "users/" + res.user.uid), {
    username,
    email,
    skills,
    workload: 0,
    role: "user"
  });

  window.location.href = "index.html";
});
</script>

</body>
</html>
