<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Task Delegator</title>

<style>
/* --- Navbar --- */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg,#c7daf9,#a6c4eb);
  color: rgb(11, 58, 99);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.navbar .logo {
  font-weight: bold;
  font-size: 20px;
}
.navbar .logo-img {
  height: 40px;
  width: 40px;
  vertical-align: middle;
}
.navbar .links {
  display: flex;
  gap: 15px;
}
.navbar .links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}

/* --- Existing styles --- */
body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  color:#1e293b;
}
.container{
  max-width:1100px;
  margin:40px auto;
  background:#ffffffdd;
  padding:30px;
  border-radius:18px;
  box-shadow:0 25px 45px rgba(0,0,0,.12)
}
h2{color:#275991;margin-top:0}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:15px
}
button{
  background:linear-gradient(90deg,#98baf0,#9dc9ff);
  color:#254774;
  border:none;
  font-weight:600;
  cursor:pointer
}
button:hover{opacity:.9}
.member{
  background:#f8fbff;
  border-left:5px solid #02142a;
  padding:18px;
  border-radius:14px;
  margin-top:15px
}
table{
  width:100%;
  margin-top:25px;
  border-collapse:collapse;
  border-radius:14px;
  overflow:hidden
}
th{
  background:#88b6ff;
  color:#254774;
  padding:14px
}
td{
  padding:14px;
  text-align:center;
  background:#fff
}
tr:hover td{background:#f1f7ff}
.plus{
  font-size:28px;
  color:#0d3d8b;
  cursor:pointer
}
.toast{
  position:fixed;
  top:30px;
  right:30px;
  background:#4cff8e;
  color:white;
  padding:16px 22px;
  border-radius:12px;
  display:none
}
.toast.error{background:#d45151}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">
    <img src="logo.png" alt="Logo" class="logo-img">
    Smart Task Assignment
  </div>
  <div class="links">
    <a href="dashboard.html">Home</a>
    <a href="index.html">Logout</a>
  </div>
</div>

<div class="container">

<h2>Team Setup</h2>
<input type="number" id="count" placeholder="Number of team members">
<button type="button" onclick="generateMembers()">Generate Team Inputs</button>
<div id="members"></div>

<hr>

<h2>Add Task <span class="plus" onclick="addTaskRow()">+</span></h2>

<table id="taskTable">
<tr>
<th>Task</th>
<th>Skill</th>
<th>Date</th>
<th>Time</th>
<th>Assigned To</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

</div>

<div id="toast" class="toast"></div>

<script>
/* ---------------- FIXED BASE ---------------- */
const TEAM_ID = "team1"
const API_BASE = "http://127.0.0.1:5000"

const team = []
const members = document.getElementById("members")
const count = document.getElementById("count")
const taskTable = document.getElementById("taskTable")

function showToast(msg,isError=false){
 const t=document.getElementById("toast")
 t.innerText=msg
 t.className="toast"+(isError?" error":"")
 t.style.display="block"
 setTimeout(()=>t.style.display="none",3000)
}

function normalizeSkill(s){
 return s.toLowerCase().replace(/\s+/g,"").split(",")
}

function timeToMin(t){
 const [h,m]=t.split(":").map(Number)
 return h*60+m
}

function overlaps(a,b,c,d){
 return a<d && b>c
}

/* ---------------- USERS ---------------- */

function generateMembers(){
 members.innerHTML=""
 team.length=0

 for(let i=1;i<=count.value;i++){
  members.innerHTML+=`
  <div class="member">
   <h4>Member ${i}</h4>
   <input id="n${i}" placeholder="Username">
   <input id="s${i}" placeholder="Skills">
   <input type="date" id="d${i}">
   <input type="time" id="f${i}">
   <input type="time" id="t${i}">
   <input type="number" id="m${i}" placeholder="Max tasks">
   <button type="button" onclick="addUser(${i})">Add User</button>
  </div>`
 }
}

async function addUser(i){
 const name  = val(`n${i}`)
 const skill = val(`s${i}`)
 const date  = val(`d${i}`)
 const fromT = val(`f${i}`)
 const toT   = val(`t${i}`)
 const max   = Number(val(`m${i}`))

 if(!name || !skill || !date || !fromT || !toT || !max){
  showToast("Fill all user fields",true)
  return
 }

 await fetch(API_BASE+"/add-user",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    teamId:TEAM_ID,
    username:name,
    skills:skill,
    date:date,
    from:fromT,
    to:toT,
    maxLoad:max
  })
 })

 team.push({
  name,
  skills:normalizeSkill(skill),
  date,
  from:timeToMin(fromT),
  to:timeToMin(toT),
  max,
  tasks:[]
 })

 showToast(`User ${name} added`)
}

/* ---------------- TASKS ---------------- */

function addTaskRow(){
 const r=taskTable.insertRow()
 r.innerHTML=`
  <td><input class="tt"></td>
  <td><input class="ts"></td>
  <td><input type="date" class="td"></td>
  <td><input type="time" class="tf"> - <input type="time" class="ttm"></td>
  <td class="as">—</td>
  <td class="st">Created</td>
  <td>
   <button type="button" onclick="assign(this)">Assign</button>
   <button type="button" onclick="removeTask(this)" style="margin-top:6px;background:#ef4444">Delete</button>
  </td>`
}

function assign(btn){
 const r = btn.closest("tr")

 const skill = normalizeSkill(r.querySelector(".ts").value)[0]
 const date  = r.querySelector(".td").value
 let from = timeToMin(r.querySelector(".tf").value)
 let to   = timeToMin(r.querySelector(".ttm").value)

 let eligible = team.filter(u=>{
  if(!u.skills.includes(skill)) return false
  if(u.date!==date) return false
  if(from<u.from || to>u.to) return false
  if(u.tasks.length>=u.max) return false
  for(let t of u.tasks){
   if(overlaps(from,to,t.from,t.to)) return false
  }
  return true
 })

 if(!eligible.length){
  showToast("No matching member",true)
  return
 }

 eligible.sort((a,b)=>a.tasks.length-b.tasks.length)
 const chosen = eligible[0]
 chosen.tasks.push({from,to})

 r.querySelector(".as").innerText = chosen.name
 r.querySelector(".st").innerText = "Pending"

 fetch(API_BASE+"/assign-task",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   teamId:TEAM_ID,
   title:r.querySelector(".tt").value,
   requiredSkill:skill,
   date,
   from:r.querySelector(".tf").value,
   to:r.querySelector(".ttm").value
  })
 })

 showToast(`Task assigned to ${chosen.name}`)
}

function removeTask(btn){
 const r=btn.closest("tr")
 if(r.querySelector(".as").innerText!=="—"){
  showToast("Cannot delete assigned task",true)
  return
 }
 r.remove()
 showToast("Task deleted")
}

function val(id){return document.getElementById(id).value}
</script>

</body>
</html>
