<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Task Delegator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #c3ecf7, #eaf6fb);
  min-height: 100vh;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #4facfe, #6dc4d5);
  padding: 16px 28px;
  color: white;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

nav h2 {
  margin: 0;
  font-weight: 700;
  letter-spacing: 0.5px;
}

nav .right a {
  color: white;
  text-decoration: none;
  margin-left: 22px;
  font-weight: 600;
  position: relative;
}

nav .right a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  left: 0;
  bottom: -4px;
  background: white;
  transition: width 0.3s;
}

nav .right a:hover::after {
  width: 100%;
}

.container {
  max-width: 750px;
  margin: 50px auto;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.12);
}

h3 {
  color: #222;
  margin-bottom: 10px;
  border-left: 5px solid #6dc4d5;
  padding-left: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  margin-bottom: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  transition: all 0.3s;
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: #6dc4d5;
  box-shadow: 0 0 8px rgba(109, 196, 213, 0.5);
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(90deg, #4facfe, #6dc4d5);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0,0,0,0.2);
}

.member-box {
  background: #f9fcff;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  border-left: 5px solid #6dc4d5;
  box-shadow: 0 10px 20px rgba(0,0,0,0.08);
}

.member-box h4 {
  margin-top: 0;
  color: #333;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin-top: 25px;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

table th {
  background: linear-gradient(90deg, #4facfe, #6dc4d5);
  color: white;
  padding: 14px;
  font-weight: 600;
}

table td {
  padding: 14px;
  background: white;
  color: #333;
}

table tr:not(:last-child) td {
  border-bottom: 1px solid #eee;
}

table tr:hover td {
  background: #f1fbff;
  transition: background 0.3s;
}

</style>
</head>

<body>

<nav>
  <h2>Smart Task Delegator</h2>
  <div class="right">
    <a href="index.html">Home</a>
    <a href="coverpage.html">Logout</a>
  </div>
</nav>

<div class="container">

  <h3>Team Setup</h3>
  <input type="number" id="teamCount" placeholder="Number of team members">
  <button onclick="generateTeamInputs()">Generate Team Inputs</button>

  <div id="teamInputs"></div>

  <h3>Task Details</h3>
  <input id="taskTitle" placeholder="Task Title">
  <input id="taskSkill" placeholder="Required Skill (e.g. javascript)">
  <button onclick="assignTask()">Assign Task</button>

  <h3>Assignment Result</h3>
  <div id="result"></div>

</div>

<script>
function generateTeamInputs() {
  const count = parseInt(document.getElementById("teamCount").value);
  const container = document.getElementById("teamInputs");
  container.innerHTML = "";

  for (let i = 1; i <= count; i++) {
    container.innerHTML += `
      <div class="member-box">
        <h4>Member ${i}</h4>
        <input id="name${i}" placeholder="Username">
        <input id="skills${i}" placeholder="Skills (comma separated)">
        <button onclick="addUser(${i})">Add User</button>
      </div>
    `;
  }
}

async function addUser(i) {
  const username = document.getElementById(`name${i}`).value.trim();
  const skills = document
    .getElementById(`skills${i}`)
    .value
    .split(",")
    .map(s => s.trim().toLowerCase());

  if (!username || skills.length === 0) {
    alert("Please enter username and skills");
    return;
  }

  const res = await fetch("http://127.0.0.1:5000/add-user", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, skills })
  });

  const data = await res.json();
  alert(data.message);
}

async function assignTask() {
  const title = document.getElementById("taskTitle").value.trim();
  const requiredSkill = document.getElementById("taskSkill").value.trim().toLowerCase();

  if (!title || !requiredSkill) {
    alert("Task title and required skill are mandatory");
    return;
  }

  const res = await fetch("http://127.0.0.1:5000/assign-task", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, requiredSkill })
  });

  const data = await res.json();

  document.getElementById("result").innerHTML = `
    <table>
      <tr>
        <th>Task</th>
        <th>Assigned To</th>
        <th>Status</th>
      </tr>
      <tr>
        <td>${data.task}</td>
        <td>${data.assignedUsername || "Unassigned"}</td>
        <td>${data.status}</td>
      </tr>
    </table>
  `;
}
</script>

</body>
</html>
