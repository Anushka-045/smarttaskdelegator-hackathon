<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Task Delegator</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  color:#1e293b;
}
.container{
  max-width:1100px;
  margin:40px auto;
  background:#ffffffdd;
  padding:30px;
  border-radius:18px;
  box-shadow:0 25px 45px rgba(0,0,0,.12)
}
h2{color:#1e40af;margin-top:0}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:15px
}
button{
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  color:#fff;
  border:none;
  font-weight:600;
  cursor:pointer
}
button:hover{opacity:.9}
.member{
  background:#f8fbff;
  border-left:5px solid #60a5fa;
  padding:18px;
  border-radius:14px;
  margin-top:15px
}
table{
  width:100%;
  margin-top:25px;
  border-collapse:collapse;
  border-radius:14px;
  overflow:hidden
}
th{
  background:#3b82f6;
  color:white;
  padding:14px
}
td{
  padding:14px;
  text-align:center;
  background:#fff
}
tr:hover td{background:#f1f7ff}
.plus{
  font-size:28px;
  color:#3b82f6;
  cursor:pointer
}
.toast{
  position:fixed;
  top:30px;
  right:30px;
  background:#22c55e;
  color:white;
  padding:16px 22px;
  border-radius:12px;
  display:none
}
.toast.error{background:#ef4444}
</style>
</head>

<body>
<div class="container">

<h2>Team Setup</h2>
<input type="number" id="count" placeholder="Number of team members">
<button onclick="generateMembers()">Generate Team Inputs</button>
<div id="members"></div>

<hr>

<h2>Add Task <span class="plus" onclick="addTaskRow()">+</span></h2>

<table id="taskTable">
<tr>
<th>Task</th>
<th>Skill</th>
<th>Date</th>
<th>Time</th>
<th>Assigned To</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

</div>

<div id="toast" class="toast"></div>

<script>
const team=[]

function showToast(msg,isError=false){
 const t=document.getElementById("toast")
 t.innerText=msg
 t.className="toast"+(isError?" error":"")
 t.style.display="block"
 setTimeout(()=>t.style.display="none",3000)
}

function normalizeSkill(s){
 return s.toLowerCase().replace(/\s+/g,"").split(",")
}

function timeToMin(t){
 if(!t) return NaN
 const [h,m]=t.split(":").map(Number)
 return h*60+m
}


function overlaps(a,b,c,d){
 return a<d && b>c
}

function generateMembers(){
 members.innerHTML=""
 team.length=0
 for(let i=1;i<=count.value;i++){
  members.innerHTML+=`
  <div class="member">
   <h4>Member ${i}</h4>
   <input id="n${i}" placeholder="Username">
   <input id="s${i}" placeholder="Skills">
   <label>Available Date</label>
   <input type="date" id="d${i}">
   <label>Start Time</label>
   <input type="time" id="f${i}">
   <label>End Time</label>
   <input type="time" id="t${i}">
   <input type="number" id="m${i}" placeholder="Max tasks per day">
   <button onclick="addUser(${i})">Add User</button>
  </div>`
 }
}

function addUser(i){

  const name  = val(`n${i}`)
  const skill = val(`s${i}`)
  const date  = val(`d${i}`)
  const fromT = val(`f${i}`)
  const toT   = val(`t${i}`)
  const max   = Number(val(`m${i}`))

  if(!name || !skill || !date || !fromT || !toT || !max){
    showToast("Fill all user fields", true)
    return
  }

  let from = timeToMin(fromT)
  let to   = timeToMin(toT)


  if(to <= from){
    to += 1440
  }

  const user = {
    name: name,
    skills: normalizeSkill(skill),
    date: date,
    from: from,
    to: to,
    max: max,
    tasks: []
  }

  team.push(user)

  showToast(`User ${name} added successfully`)
}

function addTaskRow(){
 const r=taskTable.insertRow()
 r.innerHTML=`
  <td><input class="tt"></td>
  <td><input class="ts"></td>
  <td><input type="date" class="td"></td>
  <td><input type="time" class="tf"> - <input type="time" class="ttm"></td>
  <td class="as">—</td>
  <td class="st">Created</td>
  <td>
   <button onclick="assign(this)">Assign</button>
   <button onclick="removeTask(this)" style="margin-top:6px;background:#ef4444">Delete</button>
  </td>`
}

function assign(btn){

  const r = btn.closest("tr")

  const skill = normalizeSkill(r.querySelector(".ts").value)[0]
  const date  = r.querySelector(".td").value


  let from = timeToMin(r.querySelector(".tf").value)
  let to   = timeToMin(r.querySelector(".ttm").value)

 
  if(to <= from){
    to += 1440
  }

  let eligible = team.filter(u => {

    if(!u.skills.includes(skill)) return false
    if(u.date !== date) return false

    // must fully fit in user availability
    if(from < u.from || to > u.to) return false

    if(u.tasks.length >= u.max) return false

    for(let t of u.tasks){
      if(overlaps(from, to, t.from, t.to)) return false
    }

    return true
  })

  if(!eligible.length){
    showToast("No matching member available", true)
    return
  }

  eligible.sort((a,b) => a.tasks.length - b.tasks.length)

  const chosen = eligible[0]
  chosen.tasks.push({ from, to })

  r.querySelector(".as").innerText = chosen.name
  r.querySelector(".st").innerText = "Pending"

  showToast(`Task assigned to ${chosen.name}`)
}
function removeTask(btn){
 const r=btn.closest("tr")
 if(r.querySelector(".as").innerText!=="—"){
  showToast("Cannot delete assigned task",true)
  return
 }
 r.remove()
 showToast("Task deleted")
}

function val(id){return document.getElementById(id).value}
</script>
</body>
</html>
